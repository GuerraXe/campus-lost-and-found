# Test overrides only. The base src/main/resources/application.yml is still loaded
# (activated via @ActiveProfiles("test") on AbstractApiIT), so settings not repeated
# here - notably spring.jpa.open-in-view=false - apply in tests exactly as in production.

spring:
  datasource:
    url: jdbc:h2:mem:campus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    clean-disabled: false

campus:
  auth:
    jwt-secret: test-secret-test-secret-test-secret-0123456789
  ratelimit:
    enabled: false

logging:
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
